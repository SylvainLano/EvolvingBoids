  <noscript>
    <h1>Evolving Boids</h1>
    <p>A flocking and evolution simulation in your browser. Each boid follows three simple rules: stay close to its neighbors, go the same way, and keep some room. Flocks emerge from these rules alone.</p>
    <p>Predators hunt the boids, the boids graze on drifting plankton, and every birth passes on genes for speed and fertility, with a cost and some mutations. Watch natural selection change the colors of the flocks over the generations.</p>
    <p>Draw walls and currents, sow plankton, add predators, take up challenges, let the Explain mode tell what happens, and share your world with a link.</p>
    <p>This simulation needs JavaScript. Its code is on <a href="https://github.com/SylvainLano/EvolvingBoids">GitHub</a>.</p>
